<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bayanul Uloom Suffa Dars - Examination Portal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;400;600&display=swap');

        :root {
            --primary-green: #0b6b3a;
            --secondary-green: #1fa463;
            --gold-accent: #c5a059;
            --dark-text: #2c3e50;
            --transition-speed: 1.2s;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f4f7f6;
            margin: 0;
            padding: 0;
            color: var(--dark-text);
            overflow-x: hidden;
        }

        /* Hero Header Section */
        header {
            background: linear-gradient(135deg, var(--primary-green), #064425);
            color: white;
            padding: 60px 20px;
            text-align: center;
            border-bottom: 5px solid var(--gold-accent);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all var(--transition-speed) cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            z-index: 100;
        }

        .header-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 1200px;
            margin: 0 auto;
            transition: all var(--transition-speed) cubic-bezier(0.25, 1, 0.5, 1);
        }

        .logo-container img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid white;
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            transition: all var(--transition-speed) cubic-bezier(0.25, 1, 0.5, 1);
        }

        header h1 {
            font-family: 'Amiri', serif;
            margin: 10px 0 5px;
            font-size: 2.8rem;
            letter-spacing: 1px;
            line-height: 1;
            transition: all var(--transition-speed) cubic-bezier(0.25, 1, 0.5, 1);
        }

        header p {
            margin: 0;
            font-weight: 300;
            opacity: 0.9;
            font-size: 1.2rem;
            transition: all var(--transition-speed) cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Glide Effect: Header moves to top left on focus */
        body.is-focused header {
            padding: 15px 40px;
            text-align: left;
        }

        body.is-focused .header-content {
            flex-direction: row;
            justify-content: flex-start;
            align-items: center;
            gap: 25px;
        }

        body.is-focused .logo-container img {
            width: 65px;
            height: 65px;
            margin-bottom: 0;
            border-width: 2px;
        }

        body.is-focused header h1 {
            font-size: 1.6rem;
            margin: 0;
        }

        body.is-focused header p {
            font-size: 0.95rem;
            opacity: 1;
        }

        /* Main Container */
        .main-content {
            max-width: 500px;
            margin: -30px auto 50px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            position: relative;
            z-index: 110;
            transition: margin-top var(--transition-speed) ease;
        }

        body.is-focused .main-content {
            margin-top: 40px;
        }

        .input-section {
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 15px;
            font-weight: 600;
            color: var(--primary-green);
        }

        input {
            width: 100%;
            padding: 18px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 18px;
            box-sizing: border-box;
            transition: all 0.3s;
            text-align: center;
        }

        input:focus {
            border-color: var(--primary-green);
            outline: none;
            box-shadow: 0 5px 15px rgba(11, 107, 58, 0.1);
        }

        .btn-search {
            margin-top: 25px;
            width: 100%;
            padding: 15px;
            background: var(--primary-green);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        /* Loading Spinner */
        #loader {
            display: none;
            margin: 20px auto;
            text-align: center;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(11, 107, 58, 0.1);
            border-top: 4px solid var(--primary-green);
            border-radius: 50%;
            display: inline-block;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Result Area */
        #result {
            margin-top: 30px;
        }

        .result-card {
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 25px;
            background: #fff;
            animation: slideUp 0.6s ease-out forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .student-name {
            font-family: 'Amiri', serif;
            color: var(--primary-green);
            font-size: 1.8rem;
            margin: 0 0 5px;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #f2f2f2;
        }

        th {
            color: var(--primary-green);
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .total-row {
            background: #f8fcf9;
            font-weight: bold;
            color: var(--primary-green);
        }

        .btn-print {
            width: 100%;
            padding: 14px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }

        /* PRINT STYLES */
        @media print {
            @page { margin: 1.5cm; }
            header, .input-section, .btn-print, #loader { display: none !important; }
            body { background: white !important; }
            .main-content { box-shadow: none; margin: 0 !important; max-width: 100%; padding: 0; }
            .result-card { border: 2px solid #0b6b3a; padding: 50px; border-radius: 0; }
            
            .print-header { 
                display: block !important; 
                text-align: center; 
                margin-bottom: 40px; 
                border-bottom: 3px double var(--gold-accent); 
                padding-bottom: 25px; 
            }
            .print-logo { width: 110px; height: 110px; margin-bottom: 15px; }
            .print-title { font-family: 'Amiri', serif; font-size: 28pt; color: #0b6b3a; margin: 0; }
            
            .footer-signature-centered { 
                display: block !important; 
                text-align: center; 
                margin-top: 100px; 
            }
            .sig-line {
                display: inline-block;
                width: 280px;
                border-top: 1.5px solid #000;
                padding-top: 10px;
                font-family: 'Amiri', serif;
                font-size: 14pt;
                font-weight: bold;
            }
        }

        .print-header, .footer-signature-centered { display: none; }
    </style>
</head>
<body>

    <header id="appHeader">
        <div class="header-content">
            <div class="logo-container">
                <img src="1000545194.webp" alt="Bayanul Uloom Logo" onerror="this.src='https://via.placeholder.com/130?text=LOGO'">
            </div>
            <div class="header-text">
                <h1>Bayanul Uloom Suffa Dars</h1>
                <p>Chemmankadav Kongayam</p>
            </div>
        </div>
    </header>

    <div class="main-content">
        <div class="input-section">
            <label for="reg">Examination Portal</label>
            <input type="text" id="reg" placeholder="Enter Register Number" autocomplete="off">
            <button class="btn-search" onclick="triggerSearch()">Search Result</button>
        </div>

        <div id="loader">
            <div class="spinner"></div>
            <p style="color: var(--primary-green); font-size: 0.8rem; margin-top: 10px;">Verifying credentials...</p>
        </div>

        <div id="result"></div>
    </div>

    <script>
        // Data Source
        const students = {
            "3251":{name:"Muhammed Javad",mahalli:35,Hulasa:35,SA:30,VIVA:35},
            "3252":{name:"Muhammed Sideeque",mahalli:0,Hulasa:0,SA:0,VIVA:0},
            "3253":{name:"Muhammed Fasil",Umdhah:44,Thuhfa:35,SA:50,VIVA:50},
            "3254":{name:"Muhammed Jabir",Umdhah:59,Thuhfa:35,SA:0,VIVA:0},
            "3255":{name:"Muhammed Riswan",Umdhah:58,Thuhfa:35,SA:50,VIVA:50},
            "3256":{name:"Muhammed Afreed",Umdhah:35,Thuhfa:35,SA:50,VIVA:35},
            "3257":{name:"Sharaf Ali",Umdhah:35,Thuhfa:35,SA:50,VIVA:40},
            "3258":{name:"Muhammed Jinan",Umdhah:35,Thuhfa:35,SA:30,VIVA:20},
            "3259":{name:"Muhammed Risan",Umdhah:35,Thuhfa:35,SA:50,VIVA:40},
            "3260":{name:"Muhammed Ashfaq",Noorulabsar:43,Awamil:60,SA:30,VIVA:20},
            "3261":{name:"Muhammed Aflah",Noorulabsar:35,Awamil:60,SA:30,VIVA:30},
            "3262":{name:"Muhammed Jasheer",Noorulabsar:35,Awamil:35,SA:50,VIVA:15},
            "3263":{name:"Muhammed Adnan",Noorulabsar:35,Awamil:40,SA:40,VIVA:35},
            "3264":{name:"Razi",Noorulabsar:35,Awamil:60,SA:45,VIVA:10},
            "3265":{name:"Muhammed Shahid",Noorulabsar:43,Awamil:68,SA:25,VIVA:30},
            "3266":{name:"Muhammed Jaseer",Noorulabsar:40,Awamil:55,SA:30,VIVA:30},
            "3267":{name:"Muhammed Irshad",Noorulabsar:35,Awamil:51,SA:50,VIVA:20},
            "3268":{name:"Muhammed Shamil",Noorulabsar:50,Awamil:62,SA:50,VIVA:30},
            "3269":{name:"Fahin sha",Noorulabsar:35,Meezan:40,SA:50,VIVA:40},
            "3270":{name:"Ameen Farhan",Noorulabsar:35,Meezan:36,SA:50,VIVA:30},
            "3271":{name:"Zahmil Ishan",Noorulabsar:35,Meezan:43,SA:30,VIVA:20},
            "3272":{name:"Muhammed Anas",Noorulabsar:35,Meezan:47,SA:50,VIVA:30},
            "3273":{name:"Muhammed Nabeel",Noorulabsar:45,Meezan:80,SA:50,VIVA:50},
            "3274":{name:"Muhammed Dujoom",Noorulabsar:44,Meezan:72,SA:50,VIVA:30},
            "3275":{name:"Muhammed Aslah",Noorulabsar:10,Meezan:35,SA:20,VIVA:20},
            "3276":{name:"Muhammed Uvais",Noorulabsar:10,Meezan:35,SA:50,VIVA:20},
            "3277":{name:"Muhammed Raseel",Noorulabsar:10,Meezan:35,SA:25,VIVA:20},
            "3278":{name:"Razin Shahan",Noorulabsar:10,Meezan:43,SA:30,VIVA:20},
            "3279":{name:"Muhammed Sahal",Noorulabsar:35,Meezan:60,SA:50,VIVA:50},
            "3280":{name:"Muhammed Niyas",Noorulabsar:10,Meezan:35,SA:20,VIVA:20},
            "3281":{name:"Zainul Abid",Noorulabsar:45,Meezan:35,SA:25,VIVA:25},
            "3282":{name:"Muhammed Shahmil",Noorulabsar:35,Meezan:35,SA:25,VIVA:30},
            "3283":{name:"Muhammed Arshad",Noorulabsar:35,Meezan:35,SA:25,VIVA:30}
        };

        const regInput = document.getElementById("reg");

        regInput.addEventListener('focus', () => {
            document.body.classList.add('is-focused');
        });

        regInput.addEventListener('blur', () => {
            if (regInput.value.trim() === "") {
                document.body.classList.remove('is-focused');
            }
        });

        regInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') triggerSearch();
        });

        function triggerSearch() {
            const resDiv = document.getElementById("result");
            const loader = document.getElementById("loader");
            resDiv.innerHTML = "";
            loader.style.display = "block";
            
            setTimeout(() => {
                loader.style.display = "none";
                searchResult();
            }, 800);
        }

        function searchResult() {
            const resDiv = document.getElementById("result");
            const regNo = regInput.value.trim();
            const student = students[regNo];

            if(student) {
                let rowsHtml = "";
                let grandTotal = 0;

                // Loop through keys to find subjects (skipping the "name" key)
                Object.keys(student).forEach(key => {
                    if (key !== "name") {
                        // Format the key to capitalize the first letter for display
                        let displayKey = key.charAt(0).toUpperCase() + key.slice(1);
                        rowsHtml += `<tr><td>${displayKey}</td><td style="text-align: right;">${student[key]}</td></tr>`;
                        grandTotal += Number(student[key]);
                    }
                });

                resDiv.innerHTML = `
                    <div class="result-card">
                        <div class="print-header">
                            <img src="1000545194.webp" class="print-logo" alt="Logo">
                            <div class="print-title">Bayanul Uloom Suffa Dars</div>
                            <div style="font-size: 16pt;">Chemmankadav Kongayam</div>
                            <div style="font-size: 14pt; margin-top: 10px; font-weight: bold; color: #0b6b3a;">Annual Examination Marksheet - 2026</div>
                        </div>

                        <h3 class="student-name">${student.name}</h3>
                        <p style="text-align:center; color:#777; font-size:1rem; margin-top:0;">Reg No: ${regNo}</p>
                        
                        <table>
                            <thead>
                                <tr><th>Subject Name</th><th style="text-align: right;">Marks</th></tr>
                            </thead>
                            <tbody>
                                ${rowsHtml}
                                <tr class="total-row">
                                    <td>GRAND TOTAL</td>
                                    <td style="text-align: right;">${grandTotal}</td>
                                </tr>
                            </tbody>
                        </table>

                        <div class="footer-signature-centered">
                            <div class="sig-line">Muhammed Saneer Faizy Wayanad</div>
                        </div>

                        <button class="btn-print" onclick="window.print()">
                            🖨️ Print Official Marksheet
                        </button>
                    </div>
                `;
            } else {
                resDiv.innerHTML = `<p style="color:#e74c3c; text-align:center; font-weight:bold; padding:20px;">Register number not found. Please try again.</p>`;
            }
        }
    </script>
</body>
</html>
