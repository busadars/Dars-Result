<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bayanul Uloom Suffa Dars - Examination Portal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;400;600&display=swap');

        :root {
            --primary-green: #0b6b3a;
            --gold-accent: #c5a059;
            --dark-text: #2c3e50;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f4f7f6;
            margin: 0;
            padding: 0;
            color: var(--dark-text);
        }

        /* --- UI COMPONENTS (Hidden during Print) --- */
        header {
            background: linear-gradient(135deg, var(--primary-green), #064425);
            color: white;
            padding: 40px 20px;
            text-align: center;
            border-bottom: 5px solid var(--gold-accent);
        }

        .logo-container img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid white;
            background: white;
            margin-bottom: 10px;
        }

        header h1 { font-family: 'Amiri', serif; margin: 5px 0; font-size: 2.2rem; }

        .main-content {
            max-width: 500px;
            margin: 20px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .input-section { text-align: center; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            margin-bottom: 15px;
        }

        .btn-search {
            width: 100%;
            padding: 15px;
            background: var(--primary-green);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-print {
            width: 100%;
            padding: 15px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 8px;
            margin-top: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        /* --- RESULT CARD STYLING --- */
        .result-card {
            padding: 20px;
            border: 1px solid #eee;
            border-radius: 10px;
        }

        .student-name {
            font-family: 'Amiri', serif;
            color: var(--primary-green);
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .total-row {
            font-weight: bold;
            background: #f9f9f9;
            color: var(--primary-green);
        }

        /* --- PRINT/PDF SPECIFIC STYLES --- */
        @media print {
            @page {
                size: A4;
                margin: 2cm;
            }
            /* Hide everything except the Result Card */
            header, .input-section, .btn-print, .btn-search, input {
                display: none !important;
            }
            body { background: white; }
            .main-content {
                box-shadow: none;
                margin: 0;
                max-width: 100%;
                padding: 0;
            }
            .result-card {
                border: 2px solid var(--primary-green);
                padding: 40px;
            }
            .print-only-header {
                display: block !important;
                text-align: center;
                margin-bottom: 30px;
                border-bottom: 2px solid var(--gold-accent);
                padding-bottom: 20px;
            }
            .print-logo { width: 80px; margin-bottom: 10px; }
            .footer-sig {
                display: block !important;
                margin-top: 60px;
                text-align: center;
            }
            .sig-line {
                border-top: 1px solid black;
                display: inline-block;
                width: 250px;
                padding-top: 5px;
                font-weight: bold;
            }
        }

        .print-only-header, .footer-sig { display: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="1000545194.webp" alt="Logo" onerror="this.src='https://via.placeholder.com/100'">
        </div>
        <h1>Bayanul Uloom Suffa Dars</h1>
        <p>Examination Result Portal</p>
    </header>

    <div class="main-content">
        <div class="input-section">
            <input type="text" id="regNo" placeholder="Enter Register Number">
            <button class="btn-search" onclick="search()">Search Result</button>
        </div>
        <div id="displayArea"></div>
    </div>

    <script>
        const students = {

            "3256":{name:"Muhammed Afreed",Umdhah:35,Thuhfa:35,SA:50,VIVA:35},
            "3257":{name:"Sharaf Ali",Umdhah:35,Thuhfa:35,SA:50,VIVA:40},

            "3259":{name:"Muhammed Risan",Umdhah:35,Thuhfa:35,SA:50,VIVA:40},
            "3260":{name:"Muhammed Ashfaq",Noorulabsar:43,Awamil:60,SA:30,VIVA:20},
            "3261":{name:"Muhammed Aflah",Noorulabsar:35,Awamil:60,SA:30,VIVA:30},
            "3262":{name:"Muhammed Jasheer",Noorulabsar:35,Awamil:35,SA:50,VIVA:15},
            "3263":{name:"Muhammed Adnan",Noorulabsar:35,Awamil:40,SA:40,VIVA:35},
            "3264":{name:"Razi",Noorulabsar:35,Awamil:60,SA:45,VIVA:10},

            "3267":{name:"Muhammed Irshad",Noorulabsar:35,Awamil:51,SA:50,VIVA:20},
            "3268":{name:"Muhammed Shamil",Noorulabsar:50,Awamil:62,SA:50,VIVA:30},
            "3269":{name:"Fahin sha",Noorulabsar:35,Meezan:40,SA:50,VIVA:40},

            "3277":{name:"Muhammed Raseel",Noorulabsar:10,Meezan:35,SA:25,VIVA:20},

            "3283":{name:"Muhammed Arshad",Noorulabsar:35,Meezan:35,SA:25,VIVA:30}
        };

        function search() {
            const id = document.getElementById("regNo").value;
            const display = document.getElementById("displayArea");
            const data = students[id];

            if (data) {
                let rows = "";
                let total = 0;
                Object.keys(data).forEach(k => {
                    if(k !== 'name') {
                        rows += `<tr><td>${k.toUpperCase()}</td><td>${data[k]}</td></tr>`;
                        total += data[k];
                    }
                });

                display.innerHTML = `
                    <div class="result-card">
                        <div class="print-only-header">
                            <img src="1000545194.webp" class="print-logo" onerror="this.src='https://via.placeholder.com/80'">
                            <div style="font-size: 22pt; font-family: Amiri; color: #0b6b3a;">Bayanul Uloom Suffa Dars</div>
                            <div style="font-size: 12pt;">Chemmankadav Kongayam | Result 2026</div>
                        </div>
                        <h2 class="student-name">${data.name}</h2>
                        <p style="text-align:center; margin:0; color:#666;">Reg No: ${id}</p>
                        <table>
                            ${rows}
                            <tr class="total-row"><td>GRAND TOTAL</td><td>${total}</td></tr>
                        </table>
                        <div class="footer-sig">
                            <div class="sig-line">Principal Signature</div>
                        </div>
                        <button class="btn-print" onclick="window.print()">Download Marksheet (PDF)</button>
                    </div>
                `;
            } else {
                display.innerHTML = "<p style='color:red; text-align:center;'>Student not found!</p>";
            }
        }
    </script>
</body>
</html>
