<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bayanul Uloom Suffa Dars - Examination Portal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Poppins:wght@300;400;600&display=swap');

        :root {
            --primary-green: #0b6b3a;
            --gold-accent: #c5a059;
            --bg-light: #f4f7f6;
            --transition-speed: 0.8s;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-light);
            margin: 0;
            padding: 0;
            color: #2c3e50;
        }

        /* --- GLIDE HEADER (0.10 STYLE COMPRESSION) --- */
        header {
            background: linear-gradient(135deg, var(--primary-green), #064425);
            color: white;
            padding: 70px 20px;
            text-align: center;
            border-bottom: 5px solid var(--gold-accent);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transition: all var(--transition-speed) cubic-bezier(0.19, 1, 0.22, 1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            transition: inherit;
        }

        .logo-container img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid white;
            background: white;
            margin-bottom: 20px;
            transition: inherit;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            margin: 0;
            font-size: 3rem;
            font-weight: 900;
            transition: inherit;
            line-height: 1.1;
        }

        header .location {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-top: 8px;
            font-weight: 300;
            transition: inherit;
            letter-spacing: 1px;
        }

        /* SEARCH ACTIVE / FOCUSED STATE */
        body.is-focused header {
            padding: 10px 30px; /* Highly compressed vertical space */
        }

        body.is-focused .header-content {
            flex-direction: row;
            justify-content: flex-start;
            gap: 15px;
        }

        body.is-focused .logo-container img {
            width: 42px;
            height: 42px;
            margin-bottom: 0;
            border-width: 2px;
        }

        body.is-focused header h1 {
            font-size: 1.25rem; /* Reduced for single line */
            white-space: nowrap;
        }

        body.is-focused header .location {
            font-size: 0.85rem;
            margin-top: 0;
            margin-left: 10px;
            padding-left: 10px;
            border-left: 1.5px solid rgba(255,255,255,0.4);
            white-space: nowrap;
        }

        /* --- DASHBOARD LAYOUT --- */
        .dashboard {
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            margin: 30px auto;
            gap: 25px;
            padding: 0 20px;
        }

        @media (min-width: 900px) {
            .dashboard { flex-direction: row; align-items: flex-start; }
            .sidebar { width: 340px; position: sticky; top: 100px; }
            .content-area { flex: 1; }
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.03);
        }

        .search-box h3 { margin: 0 0 20px; font-family: 'Playfair Display', serif; color: var(--primary-green); }

        input {
            width: 100%;
            padding: 18px;
            border: 2px solid #edf2f0;
            border-radius: 14px;
            font-size: 18px;
            box-sizing: border-box;
            outline: none;
            text-align: center;
            transition: border 0.3s, box-shadow 0.3s;
        }

        input:focus { border-color: var(--primary-green); box-shadow: 0 0 0 4px rgba(11, 107, 58, 0.1); }

        .search-btn {
            width: 100%;
            background: var(--primary-green);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 14px;
            margin-top: 15px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .search-btn:hover { background: #08522c; }

        /* --- LOADER --- */
        #loader { display: none; text-align: center; padding: 60px 0; }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary-green);
            border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* --- RESULT TABLE --- */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        td, th { padding: 16px; border-bottom: 1px solid #f0f0f0; text-align: left; }
        .val { text-align: right; font-weight: 700; color: var(--primary-green); }
        .total-row { background: #f9fdfb; border-top: 2px solid var(--gold-accent); }
        .total-row td { font-weight: 800; font-size: 1.3rem; color: var(--primary-green); }

        .btn-print {
            width: 100%;
            background: #2c3e50;
            color: white;
            padding: 18px;
            border-radius: 14px;
            border: none;
            margin-top: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
        }

         /* --- PRINT PDF --- */

@page{
    size: Letter;
    margin: 16mm;
}

@media print {

header,
.sidebar,
.btn-print,
#loader,
.placeholder-card{
display:none !important;
}

body{
background:white !important;
}

.dashboard{
display:block;
margin:0;
padding:0;
}

.card{
border:none;
box-shadow:none;
padding:0;
}

/* PDF PAGE */

.pdf-container{
display:flex !important;
flex-direction:column;
border:8px double var(--primary-green);
padding:45px;
min-height:92vh;
text-align:center;
background:white;
}

/* HEADER */

.pdf-header{
margin-bottom:35px;
}

.pdf-logo{
width:100px;
margin-bottom:12px;
}

.pdf-title{
font-family:'Playfair Display',serif;
font-size:34pt;
color:var(--primary-green);
margin:0;
}

/* STUDENT */

.pdf-container h2{
font-family:'Amiri';
font-size:30pt;
color:var(--primary-green);
}

/* TABLE */

.pdf-container table{
width:85%;
margin:35px auto;
font-size:14pt;
border-collapse:collapse;
}

.pdf-container td{
padding:12px;
border-bottom:1px solid #ddd;
}

.pdf-container .val{
text-align:right;
font-weight:bold;
color:var(--primary-green);
}

/* TOTAL */

.pdf-container tr:last-child{
border-top:3px solid #000;
font-size:18pt;
}

/* SIGNATURE */

.signature-box{
margin-top:auto;
display:flex !important;
flex-direction:column;
align-items:center;
padding-top:30px;
}

.sig-img{
width:200px;
margin-bottom:-12px;
}

.sig-line{
width:260px;
border-top:2px solid #000;
padding-top:8px;
font-family:'Playfair Display',serif;
font-weight:bold;
font-size:15pt;
}

}

        .pdf-container, .signature-box { display: none; }
    </style>
</head>
<body>

    <header id="header">
        <div class="header-content">
            <div class="logo-container">
                <img src="1000545194.webp" alt="Logo" onerror="this.src='https://via.placeholder.com/130'">
            </div>
            <div>
                <h1>Bayanul Uloom Suffa Dars</h1>
                <div class="location">Chemmankadav Kongayam</div>
            </div>
        </div>
    </header>

    <div class="dashboard">
        <!-- Sidebar: Search Control -->
        <div class="sidebar">
            <div class="card search-box">
                <h3>Examination Portal</h3>
                <input type="text" id="regNo" placeholder="Enter Register No" autocomplete="off">
                <button class="search-btn" onclick="triggerSearch()">Search Marksheet</button>
            </div>
        </div>

        <!-- Content Area: Result Display -->
        <div class="content-area">
            <div id="loader">
                <div class="spinner"></div>
                <p style="font-weight:600; color:var(--primary-green);">Accessing Secure Ledger...</p>
            </div>
            
            <div id="resultOutput">
                <div class="card placeholder-card" style="text-align:center; color:#adb5bd; padding: 80px 20px;">
                    <p>Provide a Registration Number in the sidebar to view side-by-side results.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const students = {
            "3251":{name:"Muhammed Javad",mahalli:35,Hulasa:35,SA:30,VIVA:35},
            "3252":{name:"Muhammed Sideeque",mahalli:0,Hulasa:0,SA:0,VIVA:0},
            "3253":{name:"Muhammed Fasil",Umdhah:44,Thuhfa:35,SA:50,VIVA:50},
            "3254":{name:"Muhammed Jabir",Umdhah:59,Thuhfa:35,SA:0,VIVA:0},
            "3255":{name:"Muhammed Riswan",Umdhah:58,Thuhfa:35,SA:50,VIVA:50},
            "3256":{name:"Muhammed Afreed",Umdhah:35,Thuhfa:35,SA:50,VIVA:35},
            "3257":{name:"Sharaf Ali",Umdhah:35,Thuhfa:35,SA:50,VIVA:40},
            "3258":{name:"Muhammed Jinan",Umdhah:35,Thuhfa:35,SA:30,VIVA:20},
            "3259":{name:"Muhammed Risan",Umdhah:35,Thuhfa:35,SA:50,VIVA:40},
            "3260":{name:"Muhammed Ashfaq",Noorulabsar:43,Awamil:60,SA:30,VIVA:20},
            "3261":{name:"Muhammed Aflah",Noorulabsar:35,Awamil:60,SA:30,VIVA:30},
            "3262":{name:"Muhammed Jasheer",Noorulabsar:35,Awamil:35,SA:50,VIVA:15},
            "3263":{name:"Muhammed Adnan",Noorulabsar:35,Awamil:40,SA:40,VIVA:35},
            "3264":{name:"Razi",Noorulabsar:35,Awamil:60,SA:45,VIVA:10},
            "3265":{name:"Muhammed Shahid",Noorulabsar:43,Awamil:68,SA:25,VIVA:30},
            "3266":{name:"Muhammed Jaseer",Noorulabsar:40,Awamil:55,SA:30,VIVA:30},
            "3267":{name:"Muhammed Irshad",Noorulabsar:35,Awamil:51,SA:50,VIVA:20},
            "3268":{name:"Muhammed Shamil",Noorulabsar:50,Awamil:62,SA:50,VIVA:30},
            "3269":{name:"Fahin sha",Noorulabsar:35,Meezan:40,SA:50,VIVA:40},
            "3270":{name:"Ameen Farhan",Noorulabsar:35,Meezan:36,SA:50,VIVA:30},
            "3271":{name:"Zahmil Ishan",Noorulabsar:35,Meezan:43,SA:30,VIVA:20},
            "3272":{name:"Muhammed Anas",Noorulabsar:35,Meezan:47,SA:50,VIVA:30},
            "3273":{name:"Muhammed Nabeel",Noorulabsar:45,Meezan:80,SA:50,VIVA:50},
            "3274":{name:"Muhammed Dujoom",Noorulabsar:44,Meezan:72,SA:50,VIVA:30},
            "3275":{name:"Muhammed Aslah",Noorulabsar:10,Meezan:35,SA:20,VIVA:20},
            "3276":{name:"Muhammed Uvais",Noorulabsar:10,Meezan:35,SA:50,VIVA:20},
            "3277":{name:"Muhammed Raseel",Noorulabsar:10,Meezan:35,SA:25,VIVA:20},
            "3278":{name:"Razin Shahan",Noorulabsar:10,Meezan:43,SA:30,VIVA:20},
            "3279":{name:"Muhammed Sahal",Noorulabsar:35,Meezan:60,SA:50,VIVA:50},
            "3280":{name:"Muhammed Niyas",Noorulabsar:10,Meezan:35,SA:20,VIVA:20},
            "3281":{name:"Zainul Abid",Noorulabsar:45,Meezan:35,SA:25,VIVA:25},
            "3282":{name:"Muhammed Shahmil",Noorulabsar:35,Meezan:35,SA:25,VIVA:30},
            "3283":{name:"Muhammed Arshad",Noorulabsar:35,Meezan:35,SA:25,VIVA:30}
        };

        const regInput = document.getElementById('regNo');
        regInput.addEventListener('focus', () => document.body.classList.add('is-focused'));
        regInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') triggerSearch(); });

        function triggerSearch() {
            const out = document.getElementById('resultOutput');
            const loader = document.getElementById('loader');
            
            out.innerHTML = "";
            loader.style.display = "block";
            document.body.classList.add('is-focused');

            setTimeout(() => {
                loader.style.display = "none";
                const id = regInput.value.trim();
                const student = students[id];

                if(student) {
                    let rows = "";
                    let total = 0;
                    Object.keys(student).forEach(key => {
                        if(key !== 'name') {
                            rows += `<tr><td>${key.toUpperCase()}</td><td class="val">${student[key]}</td></tr>`;
                            total += Number(student[key]);
                        }
                    });

                    out.innerHTML = `
                        <div class="card" style="animation: slideUp 0.5s ease-out;">
                            <div style="text-align:center; border-bottom:1px solid #eee; padding-bottom:20px; margin-bottom:20px;">
                                <h2 style="font-family:'Amiri'; font-size:2.5rem; color:var(--primary-green); margin:0;">${student.name}</h2>
                                <p style="color:#666; font-weight:600; margin-top:5px;">Reg No: ${id}</p>
                            </div>

                            <table>${rows}<tr class="total-row"><td>AGGREGATE SCORE</td><td class="val">${total}</td></tr></table>
                            
                            <button class="btn-print" onclick="window.print()">Download Premium Marksheet (PDF)</button>

                            <!-- Hidden PDF Logic -->
                            <div class="pdf-container">
                                <div class="pdf-header">
                                    <img src="1000545194.webp" class="pdf-logo">
                                    <h1 class="pdf-title">Bayanul Uloom Suffa Dars</h1>
                                    <div style="font-size:15pt; color:#444;">Chemmankadav Kongayam, Malappuram</div>
                                    <div style="margin-top:25px; font-weight:bold; font-size:18pt; border-bottom:2px solid var(--gold-accent); display:inline-block; padding:0 30px;">OFFICIAL RESULT - 2026</div>
                                </div>

                                <div style="margin: 40px 0;">
                                    <h2 style="font-family:'Amiri'; font-size:32pt; color:var(--primary-green); margin:0;">${student.name}</h2>
                                    <p style="font-size:14pt; color:#333;">Registration Number: <strong>${id}</strong></p>
                                </div>

                                <table style="width:85%; margin:0 auto; font-size:14pt;">
                                    ${rows}
                                    <tr style="border-top:3px solid #333; font-size:18pt;"><td style="font-weight:bold;">GRAND TOTAL</td><td class="val">${total}</td></tr>
                                </table>

                                <div class="signature-box">
                                    <img src="Sign01.png" class="sig-img" onerror="this.style.display='none'">
                                    <div class="sig-line">Muhammed Saneer Faizy</div>
                                    <div style="font-size:11pt; color:#555; letter-spacing:1px; margin-top:5px;">PRINCIPAL</div>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    out.innerHTML = `<div class="card" style="text-align:center; color:#e74c3c; font-weight:600;">⚠️ Registration ID not found in ledger.</div>`;
                }
            }, 800);
        }
    </script>
    <style>
        @keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    </style>
</body>
</html>
